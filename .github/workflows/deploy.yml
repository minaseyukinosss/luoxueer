name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test:douyin

      - name: Build release
        run: |
          pnpm build
          mkdir -p release/app/.next
          cp -a .next/standalone/. release/app/
          cp -a .next/static release/app/.next/static
          cp -a public release/app/public

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          for attempt in 1 2 3; do
            ssh-keyscan -T 20 -H "$SSH_HOST" >> ~/.ssh/known_hosts && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts

      - name: Sync release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="/tmp/luoxueer-deploy-${release_id}.sh"
          remote_staging="/www/wwwroot/luoxueer/releases/.${release_id}.tmp/app"
          ssh_options="-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/deploy_key"

          ssh $ssh_options "${SSH_USER}@${SSH_HOST}" "
            mkdir -p '$remote_staging'
            if [ -L /www/wwwroot/luoxueer/current ]; then
              ln -sfn \"\$(readlink -f /www/wwwroot/luoxueer/current)\" /www/wwwroot/luoxueer/.rsync-base
            elif [ -d /www/wwwroot/luoxueer/standalone ]; then
              ln -sfn /www/wwwroot/luoxueer/standalone /www/wwwroot/luoxueer/.rsync-base
            fi
          "

          for attempt in 1 2 3; do
            if rsync -azc --delete --partial --timeout=60 \
              --link-dest=/www/wwwroot/luoxueer/.rsync-base \
              -e "ssh $ssh_options" \
              release/app/ "${SSH_USER}@${SSH_HOST}:${remote_staging}/" \
              && rsync -az -e "ssh $ssh_options" \
                scripts/deploy-remote.sh "${SSH_USER}@${SSH_HOST}:${remote_script}"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Activate release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="/tmp/luoxueer-deploy-${release_id}.sh"
          cookie_b64="$(printf '%s' "$WEIBO_COOKIE" | base64 -w0)"
          for attempt in 1 2 3; do
            if ssh \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i ~/.ssh/deploy_key \
              "${SSH_USER}@${SSH_HOST}" \
              "WEIBO_COOKIE_B64='$cookie_b64' bash '$remote_script' '$release_id'"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
